<!DOCTYPE html>
<html>
<head>
    <title>Iris KNN 분류기</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f0f0f0; color: #222; }
        form { margin-bottom: 20px; }
        label { display: inline-block; width: 120px; }
        .result { margin-top: 24px; padding: 20px; max-width: 460px; background: white; border-radius: 14px; box-shadow: 0 4px 16px #0002; }
        .result img { display: block; width: 100%; max-width: 420px; height: 300px; object-fit: cover; border-radius: 10px; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>붓꽃 품종 예측 (KNN)</h1>
    <p>측정값 입력 단위: <strong>cm</strong></p>
    <form method="post">
        <label>Sepal Length:</label>
        <input type="number" step="0.01" name="sepal_length" required><br><br>
        <label>Sepal Width:</label>
        <input type="number" step="0.01" name="sepal_width" required><br><br>
        <label>Petal Length:</label>
        <input type="number" step="0.01" name="petal_length" required><br><br>
        <label>Petal Width:</label>
        <input type="number" step="0.01" name="petal_width" required><br><br>
        <button type="submit">예측</button>
    </form>
    {% if prediction %}
        <div class="result">
            <h2>예측 결과: {{ prediction }}</h2>
            {% if prediction_image %}
                <img src="{{ url_for('static', filename=prediction_image) }}" alt="{{ prediction }} 붓꽃 이미지">
            {% endif %}
        </div>
    {% endif %}
</body>
</html>
